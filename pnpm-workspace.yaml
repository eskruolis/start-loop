# One app for now. This file also makes this folder its own pnpm root,
# so it never joins a parent workspace by accident.
packages:
  - "."
onlyBuiltDependencies:
  # The local Postgres binaries (one package per platform) fix up their files after install.
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/windows-x64"
  - "@biomejs/biome"
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver
