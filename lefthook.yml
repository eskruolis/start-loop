# Runs on your Mac before code leaves it, so CI rarely fails.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,json,css,md}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
